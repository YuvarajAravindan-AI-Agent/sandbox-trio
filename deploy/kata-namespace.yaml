apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Untrusted LLM-written code gets no network at all (ingress or egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: agent-sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
