spring.application.name=sandbox-trio
server.address=127.0.0.1
server.port=8080
# kata | daytona | openshell | agentcore   (gVisor = kata adapter with TRIO_KATA_RUNTIMECLASS=gvisor)
trio.sandbox=${TRIO_SANDBOX:kata}
trio.daytona.api-key=${DAYTONA_API_KEY:}
trio.kata.runtime-class=${TRIO_KATA_RUNTIMECLASS:kata-qemu}
trio.agentcore.identifier=${TRIO_AGENTCORE_ID:aws.codeinterpreter.v1}
trio.agentcore.region=${AWS_REGION:us-east-1}

# deepseek (direct API, GCP setup) | bedrock-converse (AWS setup)
spring.ai.model.chat=${TRIO_CHAT_MODEL:deepseek}
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:unset}
spring.ai.deepseek.chat.options.model=deepseek-chat
spring.ai.deepseek.chat.options.temperature=0.1
# Bedrock: credentials from the default chain (EC2 instance profile on AWS, SSO profile on the laptop)
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${TRIO_BEDROCK_MODEL:deepseek.v3.2}
spring.ai.bedrock.converse.chat.options.temperature=0.1
